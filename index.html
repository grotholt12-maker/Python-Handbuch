<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Learning Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 flex flex-col h-screen overflow-hidden">
    <!-- Top Navigation -->
    <header class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center z-10">
        <h1 class="text-2xl font-bold"><i class="fa-brands fa-python text-yellow-400 mr-2"></i>Python Hub</h1>
        <div class="flex gap-4">
            <button id="btn-handbook" class="px-4 py-2 bg-blue-700 hover:bg-blue-600 rounded-lg font-semibold transition">📖 Handbuch</button>
            <button id="btn-sandbox" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg font-semibold transition border border-gray-600">💻 Sandbox</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex flex-1 overflow-hidden">
        
        <!-- View 1: Handbuch -->
        <div id="view-handbook" class="flex w-full h-full">
            <!-- Sidebar -->
            <aside class="w-72 bg-white border-r border-gray-200 overflow-y-auto flex flex-col shadow-inner">
                <div class="p-4 bg-gray-50 border-b border-gray-200">
                    <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider">Themen</h2>
                </div>
                <nav id="sidebar-nav" class="flex-1 p-2 space-y-4">
                    <!-- Wird durch JavaScript gefüllt -->
                </nav>
            </aside>
            <!-- Content -->
            <section class="flex-1 p-8 overflow-y-auto bg-gray-50" id="content-area">
                <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100" id="chapter-content">
                    <h2 class="text-3xl font-bold text-gray-800 mb-4">Willkommen!</h2>
                    <p class="text-gray-600">Wähle links ein Thema aus, um zu starten.</p>
                </div>
            </section>
        </div>

        <!-- View 2: Sandbox -->
        <div id="view-sandbox" class="hidden w-full h-full flex-col bg-[#1e1e1e]">
            <div class="flex-1 flex flex-col p-4">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-white font-mono text-sm">main.py</h3>
                    <button id="run-code" class="bg-green-600 hover:bg-green-500 text-white px-4 py-1 rounded text-sm font-bold flex items-center gap-2">
                        <i class="fa-solid fa-play"></i> Ausführen
                    </button>
                </div>
                <textarea id="code-editor" class="flex-1 w-full bg-[#1e1e1e] text-green-400 font-mono p-4 rounded-t border border-gray-700 focus:outline-none focus:border-blue-500 resize-none text-lg leading-relaxed" spellcheck="false">print("Hallo aus der Sandbox!")</textarea>
                <div class="h-1/3 bg-black border-t-2 border-gray-700 flex flex-col rounded-b">
                    <div class="bg-gray-800 text-gray-400 text-xs py-1 px-3 font-mono uppercase tracking-wider">Terminal Output</div>
                    <pre id="console-output" class="text-gray-300 font-mono p-3 overflow-y-auto flex-1 text-sm"></pre>
                </div>
            </div>
        </div>
    </main>

    <!-- Modul-Import! (Wichtig für die Aufteilung) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
